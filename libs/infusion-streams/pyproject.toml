[project]
name = "infusion-streams"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "infusion-models",
    "redis[hiredis]>=5.0",
    "msgpack>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infusion_streams"]
