[project]
name = "infusion-common"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "infusion-models",
    "infusion-streams",
    "structlog>=24.1",
    "pydantic-settings>=2.2",
    "redis[hiredis]>=5.0",
    "msgpack>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/infusion_common"]
