# ═══════════════════════════════════════════════
# INFUSION REDIS CONFIGURATION
# ═══════════════════════════════════════════════

# Memory
maxmemory 1024mb
maxmemory-policy noeviction

# Persistence — RDB snapshots only (crash recovery safety net)
save 300 100
appendonly no

# Performance
tcp-keepalive 60
timeout 0
tcp-backlog 511

# Logging
loglevel notice
logfile ""

# Disable unused features
notify-keyspace-events ""
