server {
    listen 3001;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS -- same reasoning as services/dashboard/
    # nginx.conf: re-resolve service names when API/WS containers are
    # recreated with new IPs.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:8000;
    set $ws_upstream http://ws-gateway:8001;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;
    gzip_min_length 256;

    # Vite fingerprints every built asset filename with a content hash,
    # unlike the legacy dashboard's hand-written js/css (which disables
    # caching entirely because it isn't hashed) -- safe to cache these
    # aggressively since a changed file gets a new URL.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Reverse proxy: REST API -> api:8000
    location /api/ {
        proxy_pass $api_upstream$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location = /health {
        proxy_pass $api_upstream/health;
    }

    # Reverse proxy: WebSocket -> ws-gateway:8001
    location /ws {
        proxy_pass $ws_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
