[project]
name = "infusion-archiver"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["infusion-models", "infusion-streams", "infusion-common", "asyncpg>=0.30"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/archiver"]
