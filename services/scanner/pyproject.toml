[project]
name = "infusion-scanner"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "infusion-models",
    "infusion-streams",
    "infusion-common",
    "msgpack>=1.0",
    "structlog>=24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scanner"]
