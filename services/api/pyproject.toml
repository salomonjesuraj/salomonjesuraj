[project]
name = "infusion-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "infusion-models",
    "infusion-streams",
    "infusion-common",
    "aiohttp>=3.9",
    "asyncpg>=0.29",
    "msgpack>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api"]
