[project]
name = "infusion-nse-scraper"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["infusion-models", "infusion-streams", "infusion-common", "asyncpg>=0.29", "aiohttp>=3.9", "msgpack>=1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nse_scraper"]
