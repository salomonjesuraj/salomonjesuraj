[project]
name = "infusion-sentiment-engine"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "infusion-common",
    "asyncpg>=0.29",
    "redis[hiredis]>=5.0",
    "transformers>=4.40,<5",
    # CPU-only torch, per docs/EBIE-IMPLEMENTATION-ANSWERS.md Q2.2 (no
    # GPU infrastructure initially -- see Dockerfile's dedicated
    # --index-url install step, which pulls the CPU wheel instead of
    # this generic pin's default CUDA build).
    "torch>=2.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentiment_engine"]
